# Regenerate HotUpdaterExampleHost.xcodeproj with `xcodegen generate` after
# editing; the generated project is committed so builds need no xcodegen.
name: HotUpdaterExampleHost
options:
  bundleIdPrefix: org.reactjs.native.example
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HotUpdaterExampleHost:
    type: application
    platform: iOS
    sources: [HotUpdaterExampleHost]
    scheme: {}
    info:
      path: HotUpdaterExampleHost/Info.plist
      properties:
        CFBundleDisplayName: HotUpdaterExample
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: HotUpdaterExample
            CFBundleURLSchemes: [hotupdaterexample]
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        # The example's ID, display name, and version, so every scenario
        # runs unchanged against this host.
        PRODUCT_BUNDLE_IDENTIFIER: org.reactjs.native.example.HotUpdaterExample
        PRODUCT_NAME: HotUpdaterExample
        CODE_SIGN_STYLE: Automatic
    # The XCFrameworks examples/v0.85.0 packages with `brownfield package:ios`.
    dependencies:
      - framework: ../../v0.85.0/ios/.brownfield/package/build/HotUpdaterExampleBrownfield.xcframework
      - framework: ../../v0.85.0/ios/.brownfield/package/build/ReactBrownfield.xcframework
      - framework: ../../v0.85.0/ios/.brownfield/package/build/hermesvm.xcframework
      - framework: ../../v0.85.0/ios/.brownfield/package/build/React.xcframework
      - framework: ../../v0.85.0/ios/.brownfield/package/build/ReactNativeDependencies.xcframework
