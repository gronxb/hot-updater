packages:
  - packages/*
  - plugins/*
  - docs
  - examples/*
  - examples-server/*

overrides:
  '@smithy/types': 4.16.1
  protobufjs: 7.6.6
  recharts@3.8.0>es-toolkit: 1.46.0

allowBuilds:
  '@bugsnag/cli': true
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  aws-sdk: true
  bun: true
  deno-bin: true
  detox: true
  dtrace-provider: true
  esbuild: true
  msw: true
  nx: true
  prisma: true
  protobufjs: true
  re2: true
  sharp: true
  sse4_crc32: false
  workerd: true

catalog:
  "@types/node": ^20
  uuidv7: ^1.0.2
  verkit: 0.4.0
  vitest: 4.1.4
catalogs:
  aws:
    "@aws-sdk/client-s3": 3.1066.0
  db:
    "@electric-sql/pglite": 0.4.1
    "@libsql/client": 0.15.15
    "@prisma/client": 6.19.3
    drizzle-orm: 0.45.2
    kysely: 0.28.17
    kysely-pglite-dialect: 1.2.0
    mongodb: 6.20.0
    mysql2: 3.19.1
    pg: 8.13.1
    prisma: 6.19.3
  firebase:
    firebase-admin: 14.2.0
  hono:
    "@hono/node-server": 1.19.17
    hono: 4.12.34
  supabase:
    "@supabase/supabase-js": 2.76.1
  tools:
    "@clack/prompts": 1.7.0
    "execa": 9.5.2
    tsdown: 0.22.14

onlyBuiltDependencies:
  - "@bugsnag/cli"
  - "@prisma/client"
  - "@prisma/engines"
  - "@firebase/util"
  - "@sentry/cli"
  - "@swc/core"
  - aws-sdk
  - better-sqlite3
  - bun
  - core-js
  - core-js-pure
  - cpu-features
  - deno-bin
  - detox
  - dtrace-provider
  - esbuild
  - msw
  - nx
  - prisma
  - protobufjs
  - re2
  - sharp
  - ssh2
  - workerd
