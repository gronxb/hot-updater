on:
  push:
    branches:
      - main
    paths:
      - "packages/react-native/android/**"
      - "examples/v0.88.0/**"
  pull_request:
    paths:
      - "packages/react-native/android/**"
      - "examples/v0.88.0/**"

name: Android Integration

jobs:
  ktlint:
    runs-on: ubuntu-latest
    name: Kotlin Lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install ktlint
        env:
          KTLINT_VERSION: 1.3.1
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/ktlint" "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x "${RUNNER_TEMP}/ktlint"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: ktlint --version
      - run: ktlint "packages/react-native/android/src/**/*.kt"

  build-new-arch:
    runs-on: ubuntu-latest
    name: Build Android (New Architecture)
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version-file: .node-version
          cache: "pnpm"
      # ubuntu-latest's default JDK is 25 on Ubuntu 26.04, whose restricted
      # method warning fails AGP's CMake configure. React Native builds with
      # JDK 17, which every Ubuntu image ships.
      - name: Use JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - run: pnpm install

      - name: Library Build
        run: pnpm build

      - name: Android Unit Tests
        run: cd examples/v0.85.0/android && ./gradlew :hot-updater_react-native:testDebugUnitTest --build-cache

      - name: Android Sandbox Unit Tests
        run: cd examples/v0.85.0/android && ./gradlew :hot-updater_react-native:testDebugUnitTest -PhotUpdaterSandbox=test --init-script ../../../packages/react-native/android/src/sandboxTest/attach.init.gradle --build-cache

      - name: Build Android
        run: cd examples/v0.76.1-new-arch/android && ./gradlew assembleDebug --build-cache && cd ../..
        env:
          HOT_UPDATER_CHANNEL: dev

  build-latest:
    runs-on: ubuntu-latest
    # The newest React Native, on the Kotlin compiler its template pins.
    name: Build Android (React Native 0.88)
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version-file: .node-version
          cache: "pnpm"
      # ubuntu-latest's default JDK is 25 on Ubuntu 26.04, whose restricted
      # method warning fails AGP's CMake configure. React Native builds with
      # JDK 17, which every Ubuntu image ships.
      - name: Use JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - run: pnpm install

      - name: Library Build
        run: pnpm build

      - name: Build Android
        run: cd examples/v0.88.0/android && ./gradlew assembleDebug --build-cache && cd ../..
        env:
          HOT_UPDATER_CHANNEL: dev

  build-old-arch:
    runs-on: ubuntu-latest
    name: Build Android (Old Architecture)
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version-file: .node-version
          cache: "pnpm"
      # ubuntu-latest's default JDK is 25 on Ubuntu 26.04, whose restricted
      # method warning fails AGP's CMake configure. React Native builds with
      # JDK 17, which every Ubuntu image ships.
      - name: Use JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - run: pnpm install

      - name: Library Build
        run: pnpm build

      - name: Build Android
        run: cd examples/v0.74.1/android && ./gradlew assembleDebug --build-cache && cd ../..
        env:
          HOT_UPDATER_CHANNEL: dev
