name: Update Sponsors

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch sponsors (commit only when sponsors changed)
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p docs/public

          gh api graphql --paginate -f query='
            query($endCursor: String) {
              user(login: "gronxb") {
                sponsorshipsAsMaintainer(
                  first: 100
                  after: $endCursor
                  activeOnly: false
                  includePrivate: false
                ) {
                  nodes {
                    sponsorEntity {
                      ... on User { login avatarUrl name url }
                      ... on Organization { login avatarUrl name url }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          ' | jq -s '[
            .[].data.user.sponsorshipsAsMaintainer.nodes[]
            | select(.sponsorEntity != null)
            | .sponsorEntity
          ]' > /tmp/public-sponsorships.json

          gh api graphql --paginate -f query='
            query($endCursor: String) {
              user(login: "gronxb") {
                lifetimeReceivedSponsorshipValues(
                  first: 100
                  after: $endCursor
                  orderBy: { field: LIFETIME_VALUE, direction: DESC }
                ) {
                  nodes {
                    amountInCents
                    sponsor {
                      ... on User { login }
                      ... on Organization { login }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          ' | jq -s '[
            .[].data.user.lifetimeReceivedSponsorshipValues.nodes[]
            | select(. != null and .sponsor != null)
          ]' > /tmp/lifetime-values.json

          jq -n \
            --slurpfile sponsorships /tmp/public-sponsorships.json \
            --slurpfile lifetimeValues /tmp/lifetime-values.json '
              ($sponsorships[0]
                | unique_by(.login)) as $publicSponsors
              | (reduce $lifetimeValues[0][] as $value ({};
                  .[$value.sponsor.login] = $value.amountInCents
                )) as $amountByLogin
              | ($publicSponsors
                  | map(.login as $login | $amountByLogin[$login] // 0)
                  | max // 1
                ) as $maxAmount
              | $publicSponsors
              | map(
                  .login as $login
                  | . + {
                      weight: (
                        (($amountByLogin[$login] // 0) / $maxAmount * 1000)
                        | round / 1000
                      )
                    }
                )
              | sort_by([-.weight, (.login | ascii_downcase)])
            ' > /tmp/sponsors.new.json

          # Extract the existing sponsors array (or use an empty array if missing)
          if [ -f docs/public/sponsors.json ]; then
            jq '.sponsors // []' docs/public/sponsors.json > /tmp/sponsors.old.json
          else
            echo '[]' > /tmp/sponsors.old.json
          fi

          # Keep updatedAt stable when the sponsor data has not changed
          if diff -q /tmp/sponsors.old.json /tmp/sponsors.new.json >/dev/null; then
            echo "No sponsor changes. Skipping update."
            exit 0
          fi

          jq -n --slurpfile sponsors /tmp/sponsors.new.json \
            '{ sponsors: $sponsors[0], updatedAt: (now | todate) }' \
            > docs/public/sponsors.json

      - name: Commit and push
        run: |
          git diff --quiet docs/public/sponsors.json || (
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add docs/public/sponsors.json
            git commit -m "chore: update sponsors list"
            git push
          )
