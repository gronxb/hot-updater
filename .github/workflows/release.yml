name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Run release with Nx
        run: |
          pnpm clear
          pnpm build

      - name: Create and publish versions
        # Pinned from changesets/action@v2 to avoid mutable release action
        # code running with repository write access.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm publish:all
          github-token: ${{ secrets.GITHUB_TOKEN }}
