name: Release

on:
  push:
    branches:
      - v0

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select release lane
        id: release-lane
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            v0)
              # v0 takes backports only. Its versions are older than the
              # 1.x line on latest, so they publish under the v0 dist-tag.
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              echo "publish=pnpm publish:v0" >> "${GITHUB_OUTPUT}"
              echo "title=chore: update v0 versions" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unsupported release branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Setup pnpm
        if: steps.release-lane.outputs.enabled == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        if: steps.release-lane.outputs.enabled == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.release-lane.outputs.enabled == 'true'
        run: pnpm install

      - name: Run release with Nx
        if: steps.release-lane.outputs.enabled == 'true'
        run: |
          pnpm clear
          pnpm build

      - name: Create and publish versions
        if: steps.release-lane.outputs.enabled == 'true'
        # Pinned from changesets/action@v1 to avoid mutable release action
        # code running with repository write access.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          commit: ${{ steps.release-lane.outputs.title }}
          title: ${{ steps.release-lane.outputs.title }}
          publish: ${{ steps.release-lane.outputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
