name: hot-updater preview
description: >-
  Deploys a pull request's bundle to its own channel, builds and registers a
  preview native build only when the registry has none for the project's
  fingerprint, and comments the install link and the channel's QR code. When
  the pull request closes, it deletes the channel.
author: gronxb
inputs:
  console-url:
    description: >-
      The Console's URL, which the comment's install links and channel QR
      code point at. The CLI reads its credentials through the config's
      secrets adapter, the job's environment by default. A pull request from
      a fork, which gets no secrets, is skipped.
    required: true
  platforms:
    description: The platforms to preview, comma-separated. iOS needs a macOS runner.
    default: android
  android-scheme:
    description: The nativeBuild.android scheme of the preview build, such as a release APK.
  ios-scheme:
    description: The nativeBuild.ios scheme of the preview build, a simulator scheme by default.
  preview-channel:
    description: The channel preview native builds embed, shared by every pull request.
    default: preview
  channel:
    description: The pull request's channel (default pr-<number>).
  credit:
    description: Whether the comment ends with "Preview by hot-updater".
    default: "true"
  comment:
    description: Whether to write the pull request comment. The comment-body output has it either way.
    default: "true"
  mode:
    description: auto (preview, or cleanup when the pull request closed), preview, or cleanup.
    default: auto
  working-directory:
    description: The app's directory, which has hot-updater.config.ts.
    default: .
  cli:
    description: The command that runs the project's hot-updater CLI.
    default: npx --no-install hot-updater
  github-token:
    description: The token that writes the comment.
    default: ${{ github.token }}

outputs:
  comment-body:
    description: The comment's Markdown.
    value: ${{ steps.run.outputs.comment-body }}
  previews:
    description: >-
      JSON of each platform's preview: platform, target, nativeBuild (id,
      artifactKind), built, and bundleId.
    value: ${{ steps.run.outputs.previews }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"
      env:
        INPUT_CONSOLE_URL: ${{ inputs.console-url }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_ANDROID_SCHEME: ${{ inputs.android-scheme }}
        INPUT_IOS_SCHEME: ${{ inputs.ios-scheme }}
        INPUT_PREVIEW_CHANNEL: ${{ inputs.preview-channel }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_CREDIT: ${{ inputs.credit }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CLI: ${{ inputs.cli }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
