// Writes this build's MIN_BUNDLE_ID into a generated source on every build,
// at execution time, so neither an up-to-date check nor the configuration
// cache keeps an earlier build's value. MIN_BUNDLE_ID is a UUIDv7 with zeroed
// random bits on the same epoch millisecond clock as the bundle IDs
// `hot-updater deploy` issues. The hot-updater CLI passes its own value as
// -PMIN_BUNDLE_ID, which wins.
abstract class GenerateHotUpdaterMinBundleIdTask extends DefaultTask {
  @Input
  @Optional
  abstract Property<String> getMinBundleId()

  @OutputDirectory
  abstract DirectoryProperty getOutputDirectory()

  @TaskAction
  void generate() {
    def minBundleId = getMinBundleId().getOrNull()?.toLowerCase(Locale.ROOT)
    if (minBundleId == null) {
      def timestampMs = System.currentTimeMillis()
      minBundleId = String.format(
        "%08x-%04x-7000-8000-000000000000",
        timestampMs >>> 16,
        timestampMs & 0xffff
      )
    } else if (!(minBundleId ==~ /[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/)) {
      throw new GradleException("MIN_BUNDLE_ID must be a UUIDv7, got: ${getMinBundleId().get()}")
    }

    def source = getOutputDirectory().file("com/hotupdater/HotUpdaterMinBundleId.java").get().asFile
    source.parentFile.mkdirs()
    source.text = """package com.hotupdater;

// Generated by generateHotUpdaterMinBundleId on every build.
final class HotUpdaterMinBundleId {
  private HotUpdaterMinBundleId() {}

  static String get() {
    return "${minBundleId}";
  }
}
"""
  }
}

def generateHotUpdaterMinBundleId = tasks.register("generateHotUpdaterMinBundleId", GenerateHotUpdaterMinBundleIdTask) {
  minBundleId.set(providers.gradleProperty("MIN_BUNDLE_ID"))
  outputDirectory.set(layout.buildDirectory.dir("generated/source/hotUpdaterMinBundleId"))
  outputs.upToDateWhen { false }
}

def agpVersion = androidComponents.pluginVersion

// AGP 7.3 added generated source directories to the Variant API. Older AGP,
// which React Native 0.70 and earlier ship, registers the task on the legacy
// variant API instead.
if (agpVersion.major > 7 || (agpVersion.major == 7 && agpVersion.minor >= 3)) {
  androidComponents {
    onVariants(selector().all()) { variant ->
      variant.sources.java.addGeneratedSourceDirectory(generateHotUpdaterMinBundleId) { it.outputDirectory }
    }
  }
} else {
  android.libraryVariants.all { variant ->
    variant.registerJavaGeneratingTask(
      generateHotUpdaterMinBundleId,
      generateHotUpdaterMinBundleId.get().outputDirectory.get().asFile
    )
  }
}
