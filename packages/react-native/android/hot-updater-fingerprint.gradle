// Writes the fingerprint each build variant embeds into a generated source, at
// execution time on every build, so neither an up-to-date check nor the
// configuration cache keeps an earlier build's value.
//
// The app root is the HOT_UPDATER_APP_ROOT Gradle property when set, else the
// directory above the Android project (<app>/android). Without a
// fingerprint.json there, the app uses the appVersion strategy and the
// fingerprint is empty. The debug build type embeds the hash fingerprint.json
// holds; any other runs `hot-updater fingerprint hash`, which computes it from
// the inputs fingerprint.json records, so the binary carries the fingerprint
// of the native interface it was built from.
abstract class GenerateHotUpdaterFingerprintHashTask extends DefaultTask {
  @Input
  abstract Property<String> getAppRoot()

  @Input
  abstract Property<Boolean> getRecordedOnly()

  @OutputDirectory
  abstract DirectoryProperty getOutputDirectory()

  private String run(List<String> command, File workingDirectory) {
    def process = new ProcessBuilder(command).directory(workingDirectory).start()
    def stdout = new StringBuilder()
    def stderr = new StringBuilder()
    process.waitForProcessOutput(stdout, stderr)
    stderr.toString().readLines().findAll { it.trim() }.each { logger.warn(it) }
    if (process.exitValue() != 0) {
      throw new GradleException("[HotUpdater] `${command.join(' ')}` failed with exit code ${process.exitValue()}.")
    }
    return stdout.toString().trim()
  }

  @TaskAction
  void generate() {
    def appRoot = new File(getAppRoot().get()).canonicalFile
    def fingerprintJson = new File(appRoot, "fingerprint.json")
    def fingerprintHash = ""
    if (fingerprintJson.isFile()) {
      if (getRecordedOnly().get()) {
        fingerprintHash = new groovy.json.JsonSlurper().parse(fingerprintJson)?.android?.hash ?: ""
      } else {
        def cli = run([
          "node",
          "-e",
          '''
          const path = require("node:path");
          const manifest = require.resolve("hot-updater/package.json", { paths: [process.argv[1]] });
          const { bin } = require(manifest);
          console.log(path.join(path.dirname(manifest), typeof bin === "string" ? bin : bin["hot-updater"]));
          ''',
          appRoot.path,
        ], appRoot)
        fingerprintHash = run(["node", cli, "fingerprint", "hash", "-p", "android"], appRoot)
      }
    }

    def source = getOutputDirectory().file("com/hotupdater/HotUpdaterBuildFingerprintHash.java").get().asFile
    source.parentFile.mkdirs()
    source.text = """package com.hotupdater;

// Generated by generateHotUpdaterFingerprintHash on every build.
final class HotUpdaterBuildFingerprintHash {
  private HotUpdaterBuildFingerprintHash() {}

  static String get() {
    return "${fingerprintHash}";
  }
}
"""
  }
}

def hotUpdaterAppRoot = providers.gradleProperty("HOT_UPDATER_APP_ROOT")
  .orElse(rootProject.projectDir.parentFile.absolutePath)

def registerHotUpdaterFingerprintTask = { String variantName, String buildType ->
  tasks.register("generateHotUpdaterFingerprintHash${variantName.capitalize()}", GenerateHotUpdaterFingerprintHashTask) {
    appRoot.set(hotUpdaterAppRoot)
    recordedOnly.set(buildType == "debug")
    outputDirectory.set(layout.buildDirectory.dir("generated/source/hotUpdaterFingerprintHash/${variantName}"))
    outputs.upToDateWhen { false }
  }
}

// AGP 7.3 added generated source directories to the Variant API. Older AGP,
// which React Native 0.70 and earlier ship, registers the task on the legacy
// variant API instead.
def hotUpdaterAgpVersion = androidComponents.pluginVersion
if (hotUpdaterAgpVersion.major > 7 || (hotUpdaterAgpVersion.major == 7 && hotUpdaterAgpVersion.minor >= 3)) {
  androidComponents {
    onVariants(selector().all()) { variant ->
      def task = registerHotUpdaterFingerprintTask(variant.name, variant.buildType)
      variant.sources.java.addGeneratedSourceDirectory(task) { it.outputDirectory }
    }
  }
} else {
  android.libraryVariants.all { variant ->
    def task = registerHotUpdaterFingerprintTask(variant.name, variant.buildType.name)
    variant.registerJavaGeneratingTask(task, task.get().outputDirectory.get().asFile)
  }
}
