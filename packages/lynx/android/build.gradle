apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hotupdater.lynx'
    compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig { minSdkVersion 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    compileOnly 'org.lynxsdk.lynx:lynx:3.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    testImplementation 'org.apache.commons:commons-compress:1.27.1'
    implementation files('libs/hot-updater-brotli-dec-1.2.0.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.withType(Test).configureEach {
    inputs.file(file('../fixtures/catalog-policy.json'))
}
