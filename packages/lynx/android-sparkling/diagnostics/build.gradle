apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hotupdater.lynx.sparkling.diagnostics'
    compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig { minSdkVersion 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    api project(':hot-updater-lynx-sparkling')
    compileOnly 'org.lynxsdk.lynx:lynx:3.9.0'
    compileOnly 'com.tiktok.sparkling:sparkling:2.1.0-rc.12'
    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    def mainVariant = name.toLowerCase().contains('release') ? 'release' : 'debug'
    def mainProject = project(':hot-updater-lynx-sparkling')
    def mainCompileTask = mainProject.tasks.named(
        "compile${mainVariant.capitalize()}Kotlin",
    )
    def mainJarTask = mainProject.tasks.named(
        "bundleLibCompileToJar${mainVariant.capitalize()}",
    )
    dependsOn(mainCompileTask, mainJarTask)
    def friendPath = mainJarTask.get().outputs.files.singleFile.absolutePath
    kotlinOptions.freeCompilerArgs += ["-Xfriend-paths=${friendPath}".toString()]
}
